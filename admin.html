<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produktverwaltung - Bluewave Electronics</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navigation -->
    <header class="bg-white shadow-sm py-6 px-8 mb-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight text-blue-600">Bluewave Electronics</h1>
            <nav class="space-x-6">
                <a href="index.html" class="text-gray-600 hover:text-blue-600 transition">Shop</a>
                <a href="admin.html" class="text-blue-600 font-semibold">Produktverwaltung</a>
            </nav>
        </div>
    </header>

    <!-- Main Content: CRUD Management -->
    <main class="max-w-5xl mx-auto px-8 flex-grow w-full mb-16">
        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Produktverwaltung</h2>
            <p class="text-gray-500 mt-2">Neue Produkte anlegen oder bestehende Datensätze verwalten[cite: 2].</p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Formular zum Anlegen eines neuen Produkts -->
            <div class="bg-white border border-gray-200 rounded-xl p-6 shadow-sm h-fit">
                <h3 class="text-xl font-semibold text-gray-900 mb-4">Neues Produkt anlegen</h3>
                <form id="create-product-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Produktname</label>
                        <input type="text" id="product-name" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="z. B. Sensor-Modul">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Preis (€)</label>
                        <input type="number" step="0.01" id="product-price" required class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="9.99">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700 transition">
                        Produkt speichern
                    </button>
                </form>
            </div>

            <!-- Liste der bestehenden Produkte zum Verwalten/Löschen -->
            <div class="lg:col-span-2 bg-white border border-gray-200 rounded-xl p-6 shadow-sm">
                <h3 class="text-xl font-semibold text-gray-900 mb-4">Bestehende Produkte</h3>
                <div id="admin-product-list" class="space-y-3">
                    <!-- Wird dynamisch per JS gefüllt -->
                    <p class="text-gray-500 text-center py-6">Lade Produkte...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        &copy; 2026 Bluewave Electronics. Alle Rechte vorbehalten.
    </footer>

    <!-- JavaScript Einbindung -->
    <script src="js/api.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
