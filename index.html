<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluewave Electronics - Shop</title>
    <!-- Tailwind CSS CDN für modernes, sauberes Design mit viel Whitespace -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navigation -->
    <header class="bg-white shadow-sm py-6 px-8 mb-10">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-tight text-blue-600">Bluewave Electronics</h1>
            <nav class="space-x-6">
                <a href="index.html" class="text-blue-600 font-semibold">Shop</a>
                <a href="admin.html" class="text-gray-600 hover:text-blue-600 transition">Produktverwaltung</a>
            </nav>
        </div>
    </header>

    <!-- Main Content: Produktübersicht -->
    <main class="max-w-7xl mx-auto px-8 flex-grow w-full mb-16">
        <div class="mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Unsere Produkte</h2>
            <p class="text-gray-500 mt-2">Entdecken Sie die neuesten Prototypen unseres Backend-Teams.</p>
        </div>

        <!-- Container für dynamische Produktkarten -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Karten werden hier per JavaScript eingefügt -->
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-6 text-center text-sm text-gray-500">
        &copy; 2026 Bluewave Electronics. Alle Rechte vorbehalten.
    </footer>

    <!-- JavaScript Einbindung -->
    <script src="js/api.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
